# Builds the Forge Android app (APK) on GitHub's servers and attaches it to a GitHub Release.
#
#   Push a tag like v0.6.1  -> a Release named "Forge v0.6.1" with Forge-0.6.1-android.apk on it.
#   Actions tab -> "Android APK" -> "Run workflow" -> a test build (download it from the run page).
#
# Before anything is published, an x86_64 build of the same app is installed on an Android emulator
# and launched; the Release only goes out if it starts and keeps running. Screenshots and the
# page's console log are kept on the run page (artifact "android-smoke").
#
# On the phone: open the Release page, tap the .apk, allow "install unknown apps" once, install.
# Nothing has to be installed on your own computer; the Android SDK, NDK, Java and Rust all live
# here. See docs/ANDROID.md.
#
# Signing: Android only installs signed apps, and only lets a new version replace the old one if
# both were signed with the same key. Put a permanent key in the repository secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) and every release
# updates in place. Without them each build is signed with a one-off key: it installs fine, but
# the next version needs the old one uninstalled first.

name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # release.yml calls this with the tag it just made (a tag pushed by a workflow starts no workflows).
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write # needed to create the Release and upload the APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      apk: ${{ steps.sign.outputs.apk }}
      emulator_apk: ${{ steps.sign.outputs.emulator_apk }}
      version: ${{ steps.version.outputs.version }}
      permanent: ${{ steps.sign.outputs.permanent }}
      fingerprint: ${{ steps.sign.outputs.fingerprint }}
    env:
      NDK_VERSION: "27.2.12479018"
      # Modern phones are 64-bit ARM; x86_64 is the emulator the smoke test runs. Add "armv7" for
      # old 32-bit phones. Each target becomes its own APK (--split-per-abi).
      ANDROID_TARGETS: "aarch64 x86_64"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version from the tag
        id: version
        env:
          CALLED_TAG: ${{ inputs.tag || '' }}
        run: |
          if [[ -n "$CALLED_TAG" ]]; then
            VERSION="${CALLED_TAG#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got '$GITHUB_REF_NAME')"; exit 1
          fi
          # Android uses this to decide that a new APK is an update of the installed one.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > conf.tmp && mv conf.tmp src-tauri/tauri.conf.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        # GitHub's Ubuntu runners come with the Android SDK; add the NDK version the build uses.
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          .github/scripts/step.sh "Install the Android NDK" "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        # `npm ci` installs exactly what package-lock.json lists. If it fails with "not in sync",
        # run `npm install` locally and commit the updated lock file.
        run: .github/scripts/step.sh "npm ci" npm ci --no-audit --no-fund

      - name: Engine tests (the same checks as on desktop)
        run: .github/scripts/step.sh "Engine tests" npm run test:engine

      - name: Build the app's web interface
        run: .github/scripts/step.sh "Web interface build" npm run build:desktop

      - name: Generate the Android project
        run: |
          # src-tauri/gen is generated, never committed; start clean every time.
          rm -rf src-tauri/gen/android
          .github/scripts/step.sh "tauri android init" npx tauri android init --ci
          .github/scripts/step.sh "tauri icon" npx tauri icon src-tauri/icons/icon.png
          # Forge's own activity: pads the page clear of the status bar, gesture bar and keyboard.
          ACTIVITY="$(find src-tauri/gen/android/app/src/main -name MainActivity.kt | head -n 1)"
          [ -n "$ACTIVITY" ] || { echo "::error::tauri android init made no MainActivity.kt"; exit 1; }
          cp src-tauri/android/MainActivity.kt "$ACTIVITY"
          # See the phone's launcher apps (Android 11+), and offer Forge as a home screen (off until
          # the person turns it on in Forge). See scripts/android-manifest.mjs.
          MANIFEST="$(find src-tauri/gen/android/app/src/main -name AndroidManifest.xml | head -n 1)"
          [ -n "$MANIFEST" ] || { echo "::error::tauri android init made no AndroidManifest.xml"; exit 1; }
          node scripts/android-manifest.mjs "$MANIFEST"
          # Resources for what the manifest adds (the Blocks launcher icon).
          cp -r src-tauri/android/res/. "$(dirname "$MANIFEST")/res/"
          # Islands and compute devices on your own network speak plain http://. Android blocks
          # that in release builds unless the app opts in.
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          if grep -q 'usesCleartextTraffic' "$GRADLE"; then
            sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$GRADLE"
          fi

      - name: Build the APK
        run: |
          # The web interface was built above, so skip Tauri's own beforeBuildCommand.
          .github/scripts/step.sh "Android compile" npx tauri android build --apk --split-per-abi --target ${ANDROID_TARGETS} --config '{"build":{"beforeBuildCommand":""}}'

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'
          ARM="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | grep -iE 'arm64|aarch64' | head -n 1)"
          X86="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | grep -i 'x86_64' | head -n 1)"
          if [[ -z "$ARM" || -z "$X86" ]]; then
            echo "::error::Expected an arm64 and an x86_64 release APK"; find src-tauri/gen/android/app/build/outputs -type f; exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            if ! echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forge.jks" 2> /dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. It must hold only the keystore file, encoded with 'base64 -w0'. See docs/ANDROID.md."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/forge.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::The keystore in ANDROID_KEYSTORE_BASE64 does not open with ANDROID_KEYSTORE_PASSWORD (wrong password, or the secret is not a keystore file). See docs/ANDROID.md."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/forge.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::The keystore has no key named '$KEY_ALIAS' (ANDROID_KEY_ALIAS). Its keys: $(keytool -list -keystore "$RUNNER_TEMP/forge.jks" -storepass "$KEYSTORE_PASSWORD" 2> /dev/null | grep -i 'keyentry' | cut -d, -f1 | paste -sd' ')"; exit 1
            fi
            KEY_KIND="permanent key from the repository secrets"
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key in the repository secrets. This APK is signed with a one-off key, so installing the next version will need this one uninstalled first. See docs/ANDROID.md."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_ALIAS=forge
            keytool -genkeypair -keystore "$RUNNER_TEMP/forge.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Forge" > /dev/null 2>&1
            KEY_KIND="one-off key"
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi
          sign() {
            "$BUILD_TOOLS/zipalign" -f -p 4 "$1" aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/forge.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out "$2" aligned.apk
            "$BUILD_TOOLS/apksigner" verify "$2"
            rm -f aligned.apk
          }
          OUT="Forge-${{ steps.version.outputs.version }}-android.apk"
          EMU="Forge-${{ steps.version.outputs.version }}-android-x86_64.apk"
          sign "$ARM" "$OUT"
          sign "$X86" "$EMU"
          rm -f "$RUNNER_TEMP/forge.jks"
          # The fingerprint is public; it lets the owner confirm which key signed this build.
          FINGERPRINT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | grep -m1 'SHA-256 digest' | sed 's/.*: //' | tr a-f A-F | sed 's/../&:/g; s/:$//')"
          echo "Signing certificate SHA-256: $FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          { echo "### Signing certificate"; echo; echo "SHA-256 \`$FINGERPRINT\` ($KEY_KIND)"; } >> "$GITHUB_STEP_SUMMARY"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "emulator_apk=$EMU" >> "$GITHUB_OUTPUT"

      - name: Keep the APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: ${{ steps.sign.outputs.apk }}

      - name: Keep the emulator APK for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.emulator_apk }}
          path: ${{ steps.sign.outputs.emulator_apk }}
          retention-days: 7

  smoke:
    name: Launch on an Android emulator
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.emulator_apk }}
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and watch Forge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: .github/scripts/android-smoke.sh "${{ needs.apk.outputs.emulator_apk }}" android-smoke
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: android-smoke
          retention-days: 14

  release:
    name: Publish the Release
    needs: [apk, smoke]
    if: inputs.tag || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.apk }}
      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Forge v${{ needs.apk.outputs.version }}
          files: ${{ needs.apk.outputs.apk }}
          # Added to the notes, not in place of them: the desktop installers add theirs too.
          append_body: true
          body: |

            **Android:** open this page on your phone, tap `${{ needs.apk.outputs.apk }}` below, and allow installs from your browser when Android asks (once).
            ${{ needs.apk.outputs.permanent == 'true' && 'Installs over the previous version; your data is kept.' || 'Signed with a one-off key: if an older Forge is installed, uninstall it first.' }}
            Signing certificate SHA-256: `${{ needs.apk.outputs.fingerprint }}`
